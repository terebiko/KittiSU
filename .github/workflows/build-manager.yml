name: Build Manager

on:
  workflow_dispatch:
    inputs:
      build_manager:
        description: 'Build KittiSU Manager APK'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish to GitHub Releases'
        required: false
        default: false
        type: boolean
      custom_tag:
        description: 'Custom release tag (optional, e.g. 20260927)'
        required: false
        default: ''
        type: string
  push:
    branches: [ "**" ]
    tags:
      - "*"
  pull_request:
  workflow_call:
    inputs:
      build_manager:
        required: false
        default: true
        type: boolean
      publish_release:
        required: false
        default: false
        type: boolean
      custom_tag:
        required: false
        default: ''
        type: string

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate temporary keystore
        if: github.event_name == 'pull_request'
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias pr-key \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=KernelSU PR Build" \
            -storetype JKS \
            -keystore pr-key.jks

          echo "keystore=$(base64 -w 0 pr-key.jks)" >> $GITHUB_OUTPUT

      - name: Extract certificate hash and size
        if: github.event_name == 'pull_request'
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
        run: |
          # Export DER certificate
          keytool -exportcert \
            -alias pr-key \
            -keystore pr-key.jks \
            -storepass "$STORE_PASS" \
            -file pr-cert.der

          # Calculate size in hex
          SIZE_DEC=$(stat -c%s pr-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT

          # Calculate SHA256 hash
          HASH=$(sha256sum pr-cert.der | awk '{print $1}')
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT

          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_pr_build_size: ${{ needs.generate-key.outputs.expected_size || '' }}
      expected_pr_build_hash: ${{ needs.generate-key.outputs.expected_hash || '' }}
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: x86_64-linux-android
            os: ubuntu-latest
          - target: armv7-linux-androideabi
            os: ubuntu-latest
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}

  build-ksud-linux-host:
    needs: [build-lkm, build-ksuinit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8

      - name: Prepare x86_64 and aarch64 patch assets
        run: |
          cp aarch64-android*-lkm/*_kernelsu.ko userspace/ksud/bin/aarch64/
          cp x86_64-android*-lkm/*_kernelsu.ko userspace/ksud/bin/x86_64/
          mv ksuinit-aarch64/ksuinit userspace/ksud/bin/aarch64/
          mv ksuinit-x86_64/ksuinit userspace/ksud/bin/x86_64/

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud
          cache-targets: false

      - name: Build Linux host ksud
        run: cargo build --release --manifest-path userspace/ksud/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: ksud-x86_64-linux-host
          path: userspace/ksud/target/release/ksud

  build-manager:
    needs: [generate-key]
    runs-on: ubuntu-latest
    if: always() && needs.generate-key.result == 'success' && (inputs.build_manager != false && github.event.inputs.build_manager != 'false')
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager_type: "spoofed"
            build_type: "release"

          - manager_type: "normal"
            build_type: "release"
          - manager_type: "normal"
            build_type: "debug"
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine commit for build
        id: commit
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
          fi

      - name: Run randomizer
        if: ${{ matrix.manager_type == 'spoofed' }}
        run: |
          chmod +x randomizer
          ./randomizer

      - name: Write key
        if: ${{ github.event_name == 'workflow_dispatch' || ( github.event_name != 'pull_request') || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE='key.jks'
            } >> gradle.properties
            echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          fi

      - name: Write PR key
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
          {
            echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
            echo KEY_ALIAS='pr-key'
            echo KEY_PASSWORD="$PR_KEY_PASSWORD"
            echo KEYSTORE_FILE='pr-key.jks'
          } >> gradle.properties
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            ./gradlew assemble${{ matrix.build_type }} -Pcommit=${{ steps.commit.outputs.COMMIT_SHA }} -PIS_PR_BUILD=true
          else
            ./gradlew assemble${{ matrix.build_type }} -Pcommit=${{ steps.commit.outputs.COMMIT_SHA }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
          path: |
            manager/app/build/outputs/apk/release/*.apk
            manager/app/build/outputs/apk/debug/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.determine.outputs.title }}-mappings"
          path: "manager/app/build/outputs/mapping/release/"
          if-no-files-found: ignore

  repack-manager:
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success'
    needs: [build-manager, build-ksud, generate-key]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager_type: "spoofed"
            build_type: "release"
          - manager_type: "normal"
            build_type: "release"
          - manager_type: "normal"
            build_type: "debug"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
            name: ${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
            path: artifacts/${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
      
      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Download arm ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-armv7-linux-androideabi
          path: artifacts/ksud-armv7-linux-androideabi

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/${{ matrix.build_type }}
          APKS=$(find artifacts/${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }} -type f -name "*.apk")
          APKS=$(echo "$APKS" | tr '\n' ' ')
          test -n "$APKS"
          cp -f $APKS manager/app/build/outputs/apk/${{ matrix.build_type }}/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/armv7-linux-androideabi/release
          mkdir -p target/x86_64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          ARMV7_KSUD=$(find artifacts/ksud-armv7-linux-androideabi -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$ARMV7_KSUD"
          test -n "$X86_64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$ARMV7_KSUD" target/armv7-linux-androideabi/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud

      - name: Prepare signing inputs
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
            echo "SIGN_KEYSTORE_FILE=pr-key.jks" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=pr-key" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PR_KEY_PASSWORD" >> $GITHUB_ENV
          else
            test -n "$PROD_KEYSTORE"
            echo "$PROD_KEYSTORE" | base64 -d > key.jks
            echo "SIGN_KEYSTORE_FILE=key.jks" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Repack and resign
        run: |
          python3 repack_apk_multi.py repack \
            -b ${{ matrix.build_type }} \
            -t release \
            -a arm64-v8a \
            -a armeabi-v7a \
            -a x86_64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Delete gradle build
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
        run: |
          artifact_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" \
            --jq '.artifacts[0].id')
          test -n "$artifact_id"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine.outputs.title }}-${{ matrix.build_type }}
          path: dist/*.apk

  upload-telegram:
    needs: [repack-manager]
    if: github.event_name != 'pull_request' && needs.repack-manager.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager_type: [ "spoofed", "normal" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
            echo "topicid=${{ vars.MESSAGE_SPOOFED_THREAD_ID }}" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
            echo "topicid=${{ vars.MESSAGE_THREAD_ID }}" >> $GITHUB_OUTPUT
          fi
        
      - name: Download Debug artifact
        if: ${{ matrix.manager_type != 'spoofed' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.determine.outputs.title }}-debug
          path: ./apk/debug

      - name: Download Release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.determine.outputs.title }}-release
          path: ./apk/release

      - name: Upload to Telegram
        if: steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ steps.determine.outputs.title }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pip3 install python-telegram-bot
          export VERSION=$(git rev-list --count HEAD)
          if [ ! "${{ matrix.manager_type }}" == "spoofed" ]; then
            APK_DEBUG=apk/debug/*.apk
          else
            APK_DEBUG=""
          fi
          APK_RELEASE=apk/release/*.apk
          python3 $GITHUB_WORKSPACE/scripts/ksubot.py $APK_DEBUG $APK_RELEASE

  release:
    needs: [build-lkm, build-ksuinit, build-ksud, build-ksud-linux-host, repack-manager]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (inputs.publish_release == true || github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/')) &&
      !contains(needs.build-lkm.result, 'failure') &&
      !contains(needs.build-ksuinit.result, 'failure') &&
      !contains(needs.build-ksud.result, 'failure') &&
      !contains(needs.build-ksud-linux-host.result, 'failure') &&
      !contains(needs.repack-manager.result, 'failure') &&
      !contains(needs.build-lkm.result, 'cancelled') &&
      !contains(needs.build-ksud.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # 1. Manager APKs
          if [ -d "downloaded-artifacts" ]; then
            find downloaded-artifacts -type f -name "*.apk" -exec cp -f {} release-assets/ \;
          fi

          # 2. Kernel LKMs: zip into KittiSU-LKM-modules.zip
          mkdir -p /tmp/lkm-modules
          find downloaded-artifacts -type f -name "*_kernelsu.ko" -exec cp -f {} /tmp/lkm-modules/ \; 2>/dev/null || true
          if compgen -G "/tmp/lkm-modules/*.ko" > /dev/null; then
            (cd /tmp/lkm-modules && zip -r9 "$GITHUB_WORKSPACE/release-assets/KittiSU-LKM-modules.zip" ./*.ko)
          fi

          # 3. Ksud binaries
          find downloaded-artifacts/ksud-aarch64-linux-android -type f -name "ksud" -exec cp -f {} release-assets/ksud-aarch64-linux-android \; 2>/dev/null || true
          find downloaded-artifacts/ksud-armv7-linux-androideabi -type f -name "ksud" -exec cp -f {} release-assets/ksud-armv7-linux-androideabi \; 2>/dev/null || true
          find downloaded-artifacts/ksud-x86_64-linux-android -type f -name "ksud" -exec cp -f {} release-assets/ksud-x86_64-linux-android \; 2>/dev/null || true
          find downloaded-artifacts/ksud-x86_64-linux-host -type f -name "ksud" -exec cp -f {} release-assets/ksud-x86_64-linux-host \; 2>/dev/null || true

          # 4. Ksuinit binaries
          find downloaded-artifacts/ksuinit-aarch64 -type f -name "ksuinit" -exec cp -f {} release-assets/ksuinit-aarch64 \; 2>/dev/null || true
          find downloaded-artifacts/ksuinit-x86_64 -type f -name "ksuinit" -exec cp -f {} release-assets/ksuinit-x86_64 \; 2>/dev/null || true

          # 5. Checksums
          cd release-assets
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          echo "Prepared release assets:"
          ls -la
          cd -

      - name: Determine Release Metadata
        id: meta
        run: |
          BUILD_DATE=$(date -u +'%Y%m%d')
          REF_NAME="${{ github.ref_name }}"
          IS_MAIN=false
          if [ "$REF_NAME" = "main" ]; then
            IS_MAIN=true
          fi

          CUSTOM_TAG="${{ inputs.custom_tag || github.event.inputs.custom_tag }}"
          if [ -n "$CUSTOM_TAG" ]; then
            TAG_NAME="$CUSTOM_TAG"
          elif [ "$IS_MAIN" = "true" ]; then
            TAG_NAME="$BUILD_DATE"
            if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
              TAG_NAME="${BUILD_DATE}.${{ github.run_number }}"
            fi
          else
            TAG_NAME="pre-${REF_NAME}-${BUILD_DATE}.${{ github.run_number }}"
          fi

          if [ "$IS_MAIN" = "true" ]; then
            PRERELEASE=false
            RELEASE_TITLE="KittiSU $BUILD_DATE"
          else
            PRERELEASE=true
            RELEASE_TITLE="KittiSU Pre-release [${REF_NAME}] - $BUILD_DATE"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          draft: false
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, subprocess, os, sys

          repo = os.environ.get("GITHUB_REPOSITORY")
          if not repo:
              sys.exit(0)

          try:
              cmd = ["gh", "release", "list", "--repo", repo, "--limit", "100", "--json", "tagName,isPrerelease,createdAt"]
              output = subprocess.check_output(cmd, text=True)
              releases = json.loads(output)
              releases.sort(key=lambda r: r.get("createdAt", ""), reverse=True)

              official = [r for r in releases if not r.get("isPrerelease", False)]
              prereleases = [r for r in releases if r.get("isPrerelease", False)]

              # Keep max 3 official releases
              if len(official) > 3:
                  for r in official[3:]:
                      tag = r.get("tagName")
                      print(f"Pruning old official release: {tag}")
                      subprocess.run(["gh", "release", "delete", tag, "--repo", repo, "--cleanup-tag", "-y"], check=False)

              # Keep max 5 pre-releases
              if len(prereleases) > 5:
                  for r in prereleases[5:]:
                      tag = r.get("tagName")
                      print(f"Pruning old pre-release: {tag}")
                      subprocess.run(["gh", "release", "delete", tag, "--repo", repo, "--cleanup-tag", "-y"], check=False)

          except Exception as e:
              print(f"Warning: Failed to prune old releases: {e}", file=sys.stderr)
          EOF
