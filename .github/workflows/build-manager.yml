name: Build Manager

on:
  workflow_dispatch:
    inputs:
      build_manager:
        description: 'Build KittiSU Manager APK'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish to GitHub Releases'
        required: false
        default: false
        type: boolean
      custom_tag:
        description: 'Custom release tag (optional, e.g. 20260927)'
        required: false
        default: ''
        type: string
  push:
    branches: [ "**" ]
    tags:
      - '*'
  pull_request:
  workflow_call:
    inputs:
      build_manager:
        required: false
        default: true
        type: boolean
      publish_release:
        required: false
        default: false
        type: boolean
      custom_tag:
        required: false
        default: ''
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate temporary keystore
        if: github.event_name == 'pull_request'
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias pr-key \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=KernelSU PR Build" \
            -storetype JKS \
            -keystore pr-key.jks

          echo "keystore=$(base64 -w 0 pr-key.jks)" >> $GITHUB_OUTPUT

      - name: Extract certificate hash and size
        if: github.event_name == 'pull_request'
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
        run: |
          # Export DER certificate
          keytool -exportcert \
            -alias pr-key \
            -keystore pr-key.jks \
            -storepass "$STORE_PASS" \
            -file pr-cert.der

          # Calculate size in hex
          SIZE_DEC=$(stat -c%s pr-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT

          # Calculate SHA256 hash
          HASH=$(sha256sum pr-cert.der | awk '{print $1}')
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT

          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"

  build-lkm:
    needs: prepare
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_pr_build_size: ${{ needs.prepare.outputs.expected_size || '' }}
      expected_pr_build_hash: ${{ needs.prepare.outputs.expected_hash || '' }}
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
          - armv7-linux-androideabi
          - riscv64-linux-android
        os: [ubuntu-latest]
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}

  build-ksud-linux-host:
    needs: [build-lkm, build-ksuinit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8

      - name: Prepare x86_64 and aarch64 patch assets
        run: |
          cp aarch64-android*-lkm/*_kernelsu.ko userspace/ksud/bin/aarch64/
          cp x86_64-android*-lkm/*_kernelsu.ko userspace/ksud/bin/x86_64/
          mv ksuinit-aarch64/ksuinit userspace/ksud/bin/aarch64/
          mv ksuinit-x86_64/ksuinit userspace/ksud/bin/x86_64/

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud
          cache-targets: false

      - name: Build Linux host ksud
        run: cargo build --release --manifest-path userspace/ksud/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: ksud-x86_64-linux-host
          path: userspace/ksud/target/release/ksud

  build-manager:
    needs: [prepare]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_manager != 'false')
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager_type: "spoofed"
            build_type: "release"

          - manager_type: "normal"
            build_type: "release"
          - manager_type: "normal"
            build_type: "debug"
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine commit for build
        id: commit
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
          fi

      - name: Run randomizer
        if: ${{ matrix.manager_type == 'spoofed' }}
        run: |
          chmod +x randomizer
          ./randomizer

      - name: Fetch KernelPatch & FolkPatch runtime assets
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          KP_TAG="0.13.9"
          FP_TAG="115404"
          FP_APK="FolkPatch_115404_0f3f42ba_on_main-release.apk"

          curl -fSL "https://github.com/LyraVoid/KernelPatch/releases/download/${KP_TAG}/kpimg-android" \
            -o app/src/main/assets/kpimg
          curl -fSL "https://github.com/LyraVoid/KernelPatch/releases/download/${KP_TAG}/kptools-android" \
            -o app/src/main/jniLibs/arm64-v8a/libkptools.so

          curl -fSL "https://github.com/LyraVoid/FolkPatch/releases/download/${FP_TAG}/${FP_APK}" \
            -o /tmp/folkpatch.apk
          unzip -o -j /tmp/folkpatch.apk \
            "lib/arm64-v8a/libapd.so" \
            "lib/arm64-v8a/libkpatch.so" \
            "lib/arm64-v8a/libresetprop.so" \
            -d app/src/main/jniLibs/arm64-v8a/
          rm -f /tmp/folkpatch.apk

          cp -f ../userspace/ksud/bin/aarch64/busybox app/src/main/jniLibs/arm64-v8a/libbusybox.so
          cp -f ../userspace/ksud/bin/x86_64/busybox app/src/main/jniLibs/x86_64/libbusybox.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/x86_64/*.so
          ls -lh app/src/main/assets/kpimg app/src/main/jniLibs/arm64-v8a/ app/src/main/jniLibs/x86_64/

      - name: Write key
        if: ${{ github.event_name == 'workflow_dispatch' || ( github.event_name != 'pull_request') || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE='key.jks'
            } >> gradle.properties
            echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          fi

      - name: Write PR key
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ needs.prepare.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.prepare.outputs.key_password }}
        run: |
          echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
          {
            echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
            echo KEY_ALIAS='pr-key'
            echo KEY_PASSWORD="$PR_KEY_PASSWORD"
            echo KEYSTORE_FILE='pr-key.jks'
          } >> gradle.properties
      
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          export BUILD_EXTRA_ARGS=""
          # The spoofed variant already randomizes applicationId in-tree; a
          # -PKSU_PACKAGE_NAME override would defeat that.
          if [ "${{ matrix.manager_type }}" != "spoofed" ] && [ "${{ github.event_name }}" == "pull_request" ]; then
            export KSU_PACKAGE_NAME="anhiutangerinee.kittisu.pr${{github.event.pull_request.number}}"
            export BUILD_EXTRA_ARGS="-PKSU_PACKAGE_NAME=$KSU_PACKAGE_NAME"
          elif [ "${{ matrix.manager_type }}" != "spoofed" ] && [ "${{ github.ref_type }}" != "tag" ] && [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "SovaSU" ]; then
            export KSU_PACKAGE_NAME="anhiutangerinee.kittisu.dev"
            export KSU_NAME="SovaSU-DEV"
            export BUILD_EXTRA_ARGS="-PKSU_PACKAGE_NAME=$KSU_PACKAGE_NAME -PKSU_NAME=$KSU_NAME"
          fi

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            ./gradlew assemble${{ matrix.build_type }} -Pcommit=${{ steps.commit.outputs.COMMIT_SHA }} -PIS_PR_BUILD=true $BUILD_EXTRA_ARGS
          else
            ./gradlew assemble${{ matrix.build_type }} -Pcommit=${{ steps.commit.outputs.COMMIT_SHA }} $BUILD_EXTRA_ARGS
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
          path: |
            manager/app/build/outputs/apk/release/*.apk
            manager/app/build/outputs/apk/debug/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.determine.outputs.title }}-mappings"
          path: "manager/app/build/outputs/mapping/release/"
          if-no-files-found: ignore

  repack-manager:
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success'
    needs: [build-manager, build-ksud, prepare]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager_type: "spoofed"
            build_type: "release"
          - manager_type: "normal"
            build_type: "release"
          - manager_type: "normal"
            build_type: "debug"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
            name: ${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
            path: artifacts/${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
      
      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Download arm ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-armv7-linux-androideabi
          path: artifacts/ksud-armv7-linux-androideabi

      - name: Download RISC-V ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-riscv64-linux-android
          path: artifacts/ksud-riscv64-linux-android


      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/${{ matrix.build_type }}
          APKS=$(find artifacts/${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }} -type f -name "*.apk")
          APKS=$(echo "$APKS" | tr '\n' ' ')
          test -n "$APKS"
          cp -f $APKS manager/app/build/outputs/apk/${{ matrix.build_type }}/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/armv7-linux-androideabi/release
          mkdir -p target/x86_64-linux-android/release
          mkdir -p target/riscv64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          ARMV7_KSUD=$(find artifacts/ksud-armv7-linux-androideabi -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          RISCV64_KSUD=$(find artifacts/ksud-riscv64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$ARMV7_KSUD"
          test -n "$X86_64_KSUD"
          test -n "$RISCV64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$ARMV7_KSUD" target/armv7-linux-androideabi/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud
          cp -f "$RISCV64_KSUD" target/riscv64-linux-android/release/ksud

      - name: Prepare signing inputs
        env:
          PR_KEYSTORE: ${{ needs.prepare.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.prepare.outputs.key_password }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
            echo "SIGN_KEYSTORE_FILE=pr-key.jks" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=pr-key" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PR_KEY_PASSWORD" >> $GITHUB_ENV
          else
            test -n "$PROD_KEYSTORE"
            echo "$PROD_KEYSTORE" | base64 -d > key.jks
            echo "SIGN_KEYSTORE_FILE=key.jks" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Repack and resign
        run: |
          python3 repack_apk_multi.py repack \
            -b ${{ matrix.build_type }} \
            -t release \
            -a arm64-v8a \
            -a armeabi-v7a \
            -a x86_64 \
            -a riscv64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Delete gradle build
        uses: GeekyEggo/delete-artifact@v6
        with:
          name: ${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine.outputs.title }}-${{ matrix.build_type }}
          path: dist/*.apk

  publish-nightly:
    needs: [repack-manager]
    if: |
      github.event_name != 'pull_request' &&
      github.ref_type != 'tag' &&
      github.ref_name == 'SovaSU' &&
      needs.repack-manager.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Download Manager release APKs
        uses: actions/download-artifact@v8
        with:
          name: Manager-release
          path: nightly-raw/normal

      - name: Download Spoofed Manager release APKs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Spoofed-Manager-release
          path: nightly-raw/spoofed

      - name: Prepare individual per-ABI APKs
        run: |
          mkdir -p nightly-assets
          find nightly-raw/normal -type f -name "*.apk" -exec cp -f {} nightly-assets/ \;
          if [ -d "nightly-raw/spoofed" ]; then
            for f in $(find nightly-raw/spoofed -type f -name "*.apk"); do
              base=$(basename "$f")
              case "${base,,}" in
                *spoof*) cp -f "$f" "nightly-assets/$base" ;;
                *) cp -f "$f" "nightly-assets/Spoofed-$base" ;;
              esac
            done
          fi
          ls -lh nightly-assets/

      - name: Update rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          NOTES=$(printf "Workflow SovaSU • %s\nCommit: %s\n\n%s\n" "$SHORT_SHA" "$SHA" "$COMMIT_MSG")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "$SHA"
          git push -f origin refs/tags/nightly

          if gh release view nightly >/dev/null 2>&1; then
            OLD_ASSETS=$(gh release view nightly --json assets --jq '.assets[].name' || true)
            for asset in $OLD_ASSETS; do
              gh release delete-asset nightly "$asset" -y || true
            done
            gh release edit nightly \
              --title "SovaSU Nightly ($SHORT_SHA)" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false
            gh release upload nightly nightly-assets/*.apk --clobber
          else
            gh release create nightly nightly-assets/*.apk \
              --title "SovaSU Nightly ($SHORT_SHA)" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false
          fi

  telegram-bot-api:
    name: Telegram Bot API
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Clone Telegram Bot API
        run: |
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git
          git status telegram-bot-api >> telegram-bot-api-status
      - name: Cache Bot API Binary
        id: cache-bot-api
        uses: actions/cache@v6.1.0
        with:
          path: telegram-bot-api-binary
          key: CI-telegram-bot-api-${{ hashFiles('telegram-bot-api-status') }}
      - name: Compile Telegram Bot API
        if: steps.cache-bot-api.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install make git zlib1g-dev libssl-dev gperf cmake g++
          cd telegram-bot-api
          rm -rf build
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=.. ..
          cmake --build . --target install -j$(nproc)
          cd ../..
          ls -l telegram-bot-api/bin/telegram-bot-api*
          cp telegram-bot-api/bin/telegram-bot-api telegram-bot-api-binary
      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: telegram-bot-api-binary
          path: telegram-bot-api-binary

  upload-telegram:
    needs: [repack-manager, telegram-bot-api]
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_call' && needs.repack-manager.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager_type: [ "spoofed", "normal" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
            echo "topicid=${{ vars.MESSAGE_SPOOFED_THREAD_ID || vars.MESSAGE_THREAD_ID || '3' }}" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
            echo "topicid=${{ vars.MESSAGE_THREAD_ID || '3' }}" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ github.ref }}" != "refs/heads/main" && "${{ github.ref }}" != "refs/heads/SovaSU" && "${{ github.ref_type }}" != "tag" ]]; then
            echo "topicid=${{ vars.MESSAGE_DEVELOPING_MANAGER_THREAD_ID || vars.MESSAGE_THREAD_ID || '3' }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Debug artifact
        if: ${{ matrix.manager_type != 'spoofed' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.determine.outputs.title }}-debug
          path: ./apk/debug

      - name: Download Release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.determine.outputs.title }}-release
          path: ./apk/release

      - name: Download Telegram Bot API Binary
        uses: actions/download-artifact@v8
        with:
          name: telegram-bot-api-binary
          path: .

      - name: Upload to Telegram
        if: steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ steps.determine.outputs.topicid }}
          DEVELOPING_THREAD_ID: ${{ vars.MESSAGE_DEVELOPING_MANAGER_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ steps.determine.outputs.title }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pip3 install python-telegram-bot
          export VERSION=$(git rev-list --count HEAD)
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            APK_DEBUG=""
          else
            APK_DEBUG=apk/debug/*.apk
          fi
          APK_RELEASE=apk/release/*.apk
          chmod +x telegram-bot-api-binary
          python3 $GITHUB_WORKSPACE/scripts/ksubot.py $APK_DEBUG $APK_RELEASE

  release:
    needs: [build-lkm, build-ksuinit, build-ksud, build-ksud-linux-host, repack-manager]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (inputs.publish_release == true || github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/')) &&
      !contains(needs.build-lkm.result, 'failure') &&
      !contains(needs.build-ksuinit.result, 'failure') &&
      !contains(needs.build-ksud.result, 'failure') &&
      !contains(needs.build-ksud-linux-host.result, 'failure') &&
      !contains(needs.repack-manager.result, 'failure') &&
      !contains(needs.build-lkm.result, 'cancelled') &&
      !contains(needs.build-ksud.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # 1. Manager APKs
          if [ -d "downloaded-artifacts" ]; then
            find downloaded-artifacts -type f -name "*.apk" -exec cp -f {} release-assets/ \;
          fi

          # 2. Kernel LKMs: zip into KittiSU-LKM-modules.zip
          mkdir -p /tmp/lkm-modules
          find downloaded-artifacts -type f -name "*_kernelsu.ko" -exec cp -f {} /tmp/lkm-modules/ \; 2>/dev/null || true
          if compgen -G "/tmp/lkm-modules/*.ko" > /dev/null; then
            (cd /tmp/lkm-modules && zip -r9 "$GITHUB_WORKSPACE/release-assets/KittiSU-LKM-modules.zip" ./*.ko)
          fi

          # 3. Ksud binaries
          find downloaded-artifacts/ksud-aarch64-linux-android -type f -name "ksud" -exec cp -f {} release-assets/ksud-aarch64-linux-android \; 2>/dev/null || true
          find downloaded-artifacts/ksud-armv7-linux-androideabi -type f -name "ksud" -exec cp -f {} release-assets/ksud-armv7-linux-androideabi \; 2>/dev/null || true
          find downloaded-artifacts/ksud-x86_64-linux-android -type f -name "ksud" -exec cp -f {} release-assets/ksud-x86_64-linux-android \; 2>/dev/null || true
          find downloaded-artifacts/ksud-x86_64-linux-host -type f -name "ksud" -exec cp -f {} release-assets/ksud-x86_64-linux-host \; 2>/dev/null || true

          # 4. Ksuinit binaries
          find downloaded-artifacts/ksuinit-aarch64 -type f -name "ksuinit" -exec cp -f {} release-assets/ksuinit-aarch64 \; 2>/dev/null || true
          find downloaded-artifacts/ksuinit-x86_64 -type f -name "ksuinit" -exec cp -f {} release-assets/ksuinit-x86_64 \; 2>/dev/null || true

          # 5. Checksums
          cd release-assets
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          echo "Prepared release assets:"
          ls -la
          cd -

      - name: Determine Release Metadata
        id: meta
        run: |
          BUILD_DATE=$(date -u +'%Y%m%d')
          REF_NAME="${{ github.ref_name }}"
          IS_MAIN=false
          if [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "SovaSU" ]; then
            IS_MAIN=true
          fi

          CUSTOM_TAG="${{ inputs.custom_tag || github.event.inputs.custom_tag }}"
          if [ -n "$CUSTOM_TAG" ]; then
            TAG_NAME="$CUSTOM_TAG"
          elif [ "$IS_MAIN" = "true" ]; then
            TAG_NAME="$BUILD_DATE"
            if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
              TAG_NAME="${BUILD_DATE}.${{ github.run_number }}"
            fi
          else
            TAG_NAME="pre-${REF_NAME}-${BUILD_DATE}.${{ github.run_number }}"
          fi

          if [ "$IS_MAIN" = "true" ]; then
            PRERELEASE=false
            RELEASE_TITLE="SovaSU $BUILD_DATE"
          else
            PRERELEASE=true
            RELEASE_TITLE="SovaSU Pre-release [${REF_NAME}] - $BUILD_DATE"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          draft: false
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, subprocess, os, sys

          repo = os.environ.get("GITHUB_REPOSITORY")
          if not repo:
              sys.exit(0)

          try:
              cmd = ["gh", "release", "list", "--repo", repo, "--limit", "100", "--json", "tagName,isPrerelease,createdAt"]
              output = subprocess.check_output(cmd, text=True)
              releases = json.loads(output)
              releases.sort(key=lambda r: r.get("createdAt", ""), reverse=True)

              official = [r for r in releases if not r.get("isPrerelease", False)]
              prereleases = [r for r in releases if r.get("isPrerelease", False) and r.get("tagName") != "nightly"]

              # Keep max 3 official releases
              if len(official) > 3:
                  for r in official[3:]:
                      tag = r.get("tagName")
                      print(f"Pruning old official release: {tag}")
                      subprocess.run(["gh", "release", "delete", tag, "--repo", repo, "--cleanup-tag", "-y"], check=False)

              # Keep max 5 pre-releases
              if len(prereleases) > 5:
                  for r in prereleases[5:]:
                      tag = r.get("tagName")
                      print(f"Pruning old pre-release: {tag}")
                      subprocess.run(["gh", "release", "delete", tag, "--repo", repo, "--cleanup-tag", "-y"], check=False)

          except Exception as e:
              print(f"Warning: Failed to prune old releases: {e}", file=sys.stderr)
          EOF
