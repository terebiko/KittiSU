name: Trigger GKI kernel build

on:
  push:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger builder for this branch
        env:
          GH_TOKEN: ${{ secrets.BUILDER_TOKEN }}
          KITTISU_BRANCH: ${{ github.ref_name }}
        run: |
          gh workflow run kernel-custom.yml \
            --repo thanhhuybynight/GKI_KernelSU_SUSFS \
            --ref dev \
            -f kernel_version=5.15 \
            -f os_patch_level=2024-05 \
            -f kernelsu_variant=ReSukiSU \
            -f version=KittiSU-${KITTISU_BRANCH} \
            -f build_time=N \
            -f use_kpm='enabled (开启)' \
            -f droidspaces=678 \
            -f artifact_upload_mode='上传全部' \
            -f droidspaces_ntsync=false \
            -f use_zram=true \
            -f use_bbg=true \
            -f use_rekernel=true \
            -f cve_2026_43499_patch=false \
            -f cancel_susfs=false \
            -f supp_op=false \
            -f ksu_repository=https://github.com/terebiko/KittiSU \
            -f ksu_branch="$KITTISU_BRANCH"
