name: Legacy kernel regression

on:
  workflow_dispatch:
  push:
    branches:
      - testing
    paths:
      - kernel/**
      - .github/workflows/legacy-kernel.yml
  pull_request:
    paths:
      - kernel/**
      - .github/workflows/legacy-kernel.yml
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.4'
            ref: deprecated/android-3.4
            arch: arm
            cross: arm-linux-gnueabi-
            package: gcc-arm-linux-gnueabi
          - version: '3.18'
            ref: deprecated/android-3.18
            arch: arm64
            cross: aarch64-linux-gnu-
            package: gcc-aarch64-linux-gnu
          - version: '4.4'
            ref: deprecated/android-4.4
            arch: arm64
            cross: aarch64-linux-gnu-
            package: gcc-aarch64-linux-gnu
          - version: '4.9'
            ref: deprecated/android-4.9
            arch: arm64
            cross: aarch64-linux-gnu-
            package: gcc-aarch64-linux-gnu
          - version: '4.14'
            ref: deprecated/android-4.14
            arch: arm64
            cross: aarch64-linux-gnu-
            package: gcc-aarch64-linux-gnu
          - version: '4.19'
            ref: deprecated/android-4.19-stable
            arch: arm64
            cross: aarch64-linux-gnu-
            package: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          path: KittiSU

      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.package }}

      - name: Fetch Android ${{ matrix.version }} kernel
        run: |
          git clone --depth=1 --branch '${{ matrix.ref }}' \
            https://android.googlesource.com/kernel/common kernel-src

      - name: Integrate KittiSU
        working-directory: kernel-src
        run: |
          ln -s "$GITHUB_WORKSPACE/KittiSU/kernel" drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Build manual-hook module
        working-directory: kernel-src
        env:
          ARCH: ${{ matrix.arch }}
          CROSS_COMPILE: ${{ matrix.cross }}
        run: |
          make defconfig
          scripts/config --enable KSU --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK --disable KPM
          make olddefconfig
          make prepare modules_prepare
          make KCFLAGS=-Wno-error WERROR=0 -j2 M=drivers/kernelsu modules
